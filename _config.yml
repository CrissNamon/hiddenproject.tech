# Built by GitHub Pages (Jekyll 3). Pages without front matter, such as the ad
# landings and privacy policies, are copied as they are.
title: Hidden Project
description: An independent developer publishing on Google Play and App Store
url: https://hiddenproject.tech
baseurl: ""
author: Danila Rassokhin
email: support@hiddenproject.tech
timezone: Asia/Yerevan
lang: en

# Shown in the footer and the About section, and listed as sameAs for search engines.
# icon names a drawing in _includes/social-links.html.
social:
  - name: Instagram
    icon: instagram
    url: https://www.instagram.com/tech.hiddenproject/
  - name: X
    icon: x
    url: https://x.com/hiddenprjtech
  - name: TikTok
    icon: tiktok
    url: https://www.tiktok.com/@hiddenproject.tech
  - name: YouTube
    icon: youtube
    url: https://www.youtube.com/@hiddenprojecttech
  - name: Google Play
    icon: google-play
    url: https://play.google.com/store/apps/dev?id=7391390601934110448
  - name: App Store
    icon: app-store
    url: https://apps.apple.com/us/developer/danila-rassokhin/id6824474400

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Posts live in _posts/ as YYYY-MM-DD-title.md and are served at /blog/title/.
# The permalink is set for posts only: site-wide, it would also move pages
# like privacy.html to /privacy/.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
