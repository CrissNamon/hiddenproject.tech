<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" fill="none">
  <rect width="640" height="720" fill="#14181b"/>
  <radialGradient id="lamp" cx="50%" cy="18%" r="55%">
    <stop offset="0" stop-color="#d8924a" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#d8924a" stop-opacity="0"/>
  </radialGradient>
  <rect width="640" height="720" fill="url(#lamp)"/>

  <!-- desk -->
  <rect x="0" y="470" width="640" height="250" fill="#1a1613"/>
  <rect x="0" y="470" width="640" height="4" fill="#2c261f"/>

  <!-- cover -->
  <rect x="78" y="96" width="484" height="300" rx="6" fill="#3a2a20"/>
  <!-- page block -->
  <rect x="96" y="78" width="448" height="292" fill="#242b30"/>
  <rect x="96" y="78" width="210" height="292" fill="#2b3338"/>
  <rect x="334" y="78" width="210" height="292" fill="#263034"/>
  <!-- spine -->
  <rect x="306" y="78" width="28" height="292" fill="#12161a"/>
  <!-- ribbon -->
  <rect x="312" y="58" width="16" height="118" fill="#d8924a"/>
  <rect x="312" y="168" width="8" height="14" fill="#d8924a"/>
  <rect x="320" y="176" width="8" height="10" fill="#d8924a"/>

  <!-- left page lines -->
  <g fill="#8d877c">
    <rect x="122" y="112" width="150" height="6"/>
    <rect x="122" y="136" width="168" height="6"/>
    <rect x="122" y="160" width="132" height="6"/>
    <rect x="122" y="184" width="160" height="6"/>
    <rect x="122" y="208" width="96" height="6"/>
  </g>
  <!-- progress -->
  <rect x="122" y="312" width="160" height="12" fill="#1a1e22"/>
  <rect x="122" y="312" width="108" height="12" fill="#d8924a"/>

  <!-- right page lines -->
  <g fill="#7e7870">
    <rect x="360" y="112" width="140" height="6"/>
    <rect x="360" y="136" width="120" height="6"/>
    <rect x="360" y="160" width="148" height="6"/>
  </g>

  <!-- summary slip -->
  <rect x="368" y="196" width="168" height="132" fill="#1e1814"/>
  <rect x="368" y="196" width="168" height="8" fill="#d8924a"/>
  <g fill="#b7b1a6">
    <rect x="386" y="224" width="120" height="6"/>
    <rect x="386" y="246" width="132" height="6"/>
    <rect x="386" y="268" width="88" height="6"/>
    <rect x="386" y="290" width="104" height="6"/>
  </g>
  <rect x="508" y="286" width="12" height="12" fill="#8eae78"/>

  <!-- pencil -->
  <rect x="168" y="512" width="150" height="16" fill="#d8924a"/>
  <rect x="156" y="512" width="12" height="16" fill="#c5cdc8"/>
  <rect x="318" y="512" width="22" height="16" fill="#ead7b8"/>
  <rect x="340" y="516" width="12" height="8" fill="#2a241c"/>

  <!-- streak -->
  <g>
    <rect x="156" y="572" width="36" height="36" fill="#d8924a"/>
    <rect x="204" y="572" width="36" height="36" fill="#d8924a"/>
    <rect x="252" y="572" width="36" height="36" fill="#d8924a"/>
    <rect x="300" y="572" width="36" height="36" fill="#d8924a"/>
    <rect x="348" y="572" width="36" height="36" fill="#d8924a"/>
    <rect x="396" y="572" width="36" height="36" fill="#d8924a"/>
    <rect x="444" y="572" width="36" height="36" fill="#241e18" stroke="#3a342c" stroke-width="4"/>
    <rect x="492" y="572" width="36" height="36" fill="#241e18" stroke="#3a342c" stroke-width="4"/>
  </g>
</svg>
